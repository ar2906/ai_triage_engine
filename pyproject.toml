[project]
name = "sre-triage-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ar2906", email = "85203188+ar2906@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.165.0",
    "fastmcp>=4.2.5",
    "langchain-anthropic>=1.7.12",
    "langchain-mcp-adapters>=0.3.1",
    "langgraph>=1.2.24",
    "mcp[cli]>=2.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
sre-triage-engine = "sre_triage_engine:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
